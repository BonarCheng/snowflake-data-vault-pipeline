name: Deploy to Snowflake

on:
    workflow_dispatch:
    push:
      paths:
        - ".github/workflows/deploy.yml"

env:
  SNOWFLAKE_CONNECTIONS_WORKFLOW_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_CONNECTIONS_WORKFLOW_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_CONNECTIONS_WORKFLOW_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
  SNOWFLAKE_CONNECTIONS_WORKFLOW_PRIVATE_KEY_RAW: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
  SNOWFLAKE_CONNECTIONS_WORKFLOW_PRIVATE_KEY_PASSPHRASE: ${{ secrets.PRIVATE_KEY_PASSPHRASE }}

jobs:
  run-query:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install snowflake CLI
        uses: snowflake-Labs/snowflake-cli-action@v1.5
        with:
          cli-version: "latest"
          default-config-file-path: ${{ github.workspace }}/config/config.toml

      - name: Check Version and Verify Connection
        run: |
            snow --version
            snow connection test
            echo "Using branch $GITHUB_REF_NAME"
            
            
      - name: Run Snowflake query
        run: |
          snow sql -q "
          use role accountadmin;
          USE DATABASE BAKERY_DB;
          USE SCHEMA BAKERY_DB.ORDER
          SELECT * FROM CUSTOMER_ORDERS LIMIT 10;"
        